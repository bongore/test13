<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web3 Quiz Platform</title>
    <script>
      (function () {
        var basePath = "/test13";
        var locationRef = window.location;
        var pathname = locationRef.pathname.replace(/\/+$/, "");
        var routePath = pathname;

        if (basePath && routePath.indexOf(basePath) === 0) {
          routePath = routePath.slice(basePath.length) || "/";
        }

        if (!routePath || routePath === "/") {
          routePath = "/dashboard";
        }

        var redirectValue = routePath + locationRef.search + locationRef.hash;
        var redirectUrl = basePath + "/?redirect=" + encodeURIComponent(redirectValue);
        locationRef.replace(redirectUrl);
      }());
    </script>
  </head>
  <body>
    <p>ページを読み込んでいます。</p>
  </body>
</html>
